name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r api/requirements.txt pytest ruff
      - run: ruff check api scripts tests
      # ERA's endpoint is stood in for by the Luxembourg sample (tests/sample.py).
      - name: Shapes compile and evaluate on the sample
        run: pytest -q tests
      - name: API tests
        working-directory: api
        run: pytest -q tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config -q
      - run: docker compose build
      - name: Search engine settings written at start (docs/seo.md)
        run: |
          img=ghcr.io/matdata-eu/rinf-describe-web:latest
          docker run -d -p 8081:80 "$img"
          docker run -d -p 8082:80 -e DESCRIBE_PUBLIC_URL=https://describe.example.org "$img"
          sleep 3
          # no public address: not indexed
          curl -fsS localhost:8081/robots.txt | grep -qx 'Disallow: /'
          curl -fsSI localhost:8081/ | grep -qi '^x-robots-tag: noindex'
          curl -fsS localhost:8081/ | grep -q '<meta name="robots" content="noindex, nofollow" />'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8081/sitemap.xml)" = 404
          # public address: canonical link, sitemaps, no noindex
          curl -fsS localhost:8082/robots.txt | grep -qx 'Sitemap: https://describe.example.org/sitemap.xml'
          curl -fsS localhost:8082/ | grep -q '<link rel="canonical" href="https://describe.example.org/" />'
          ! curl -fsS localhost:8082/ | grep -q 'name="robots"'
          ! curl -fsSI localhost:8082/ | grep -qi '^x-robots-tag'
          curl -fsS localhost:8082/sitemap-site.xml | grep -q '<loc>https://describe.example.org/</loc>'
          curl -fsS localhost:8082/robots.txt | grep -qx 'Crawl-delay: 1'
          # /api/ is rate limited per client (docs/deploy.md); no API runs here, so only the 429s answer.
          test "$( { for i in $(seq 60); do curl -s -m 2 -o /dev/null -w '%{http_code}\n' localhost:8081/api/health & done; wait; } | grep -c 429)" -gt 0
