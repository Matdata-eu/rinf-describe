# RINF Describe: pages of RINF resources, built on the spot from ERA's SPARQL endpoint.
#
#   docker compose up -d --build        then open http://<host>:${DESCRIBE_PORT:-8090}
#
# Copy .env.example to .env to change the port, the environments or the RINF Atlas
# instance the search box asks.
name: rinf-describe

services:
  describe-api:
    image: ${DESCRIBE_IMAGE:-ghcr.io/matdata-eu/rinf-describe}-api:${DESCRIBE_VERSION:-latest}
    build:
      # The repository: the image carries shapes/ for the pages it builds.
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DESCRIBE_ENVS: ${DESCRIBE_ENVS:-prod=PROD,uat=UAT}
      DESCRIBE_LIVE_BATCH: ${DESCRIBE_LIVE_BATCH:-12}
      DESCRIBE_LIVE_WORKERS: ${DESCRIBE_LIVE_WORKERS:-8}
      # Limits on what one instance asks of ERA's endpoint (docs/deploy.md).
      DESCRIBE_MAX_QUERIES: ${DESCRIBE_MAX_QUERIES:-16}
      DESCRIBE_CACHE_ENTRIES: ${DESCRIBE_CACHE_ENTRIES:-2000}
      DESCRIBE_ATLAS_URL: ${DESCRIBE_ATLAS_URL-https://rinf-atlas.matdata.eu}
      # With a public address the API serves the sitemaps of the describe pages (docs/seo.md).
      DESCRIBE_PUBLIC_URL: ${DESCRIBE_PUBLIC_URL:-}

  describe-web:
    image: ${DESCRIBE_IMAGE:-ghcr.io/matdata-eu/rinf-describe}-web:${DESCRIBE_VERSION:-latest}
    build:
      context: ./web
    restart: unless-stopped
    environment:
      # Search engines: empty asks them not to index; see docs/seo.md.
      DESCRIBE_PUBLIC_URL: ${DESCRIBE_PUBLIC_URL:-}
      DESCRIBE_INDEXING: ${DESCRIBE_INDEXING:-}
      # Requests per second per client to /api/ ("off": no limit), and the reverse proxies
      # in front of this one whose X-Forwarded-For names the client (docs/deploy.md).
      DESCRIBE_RATE_LIMIT: ${DESCRIBE_RATE_LIMIT:-10}
      DESCRIBE_TRUSTED_PROXIES: ${DESCRIBE_TRUSTED_PROXIES:-}
    ports:
      - "${DESCRIBE_PORT:-8090}:80"
    volumes:
      # Pages of your own, such as site/privacy.html (docs/privacy.md), served at /site/.
      - ./site:/usr/share/nginx/html/site:ro
    depends_on:
      - describe-api
