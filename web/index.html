<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Readable pages for every resource of the EU Register of Railway Infrastructure (ERA RINF): sections of line, tracks and their parameters, laid out by SHACL shapes." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#10273F" />
    <title>RINF Describe</title>
    <script>
      // Apply a forced light/dark theme before first paint (see src/theme.ts).
      try { var t = localStorage.getItem('describe-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>
      <div class="noscript"><p><b>RINF Describe needs JavaScript.</b> It shows the resources of ERA's Register of
        Infrastructure (RINF) as readable pages. Source: <a href="https://github.com/Matdata-eu/rinf-describe">github.com/Matdata-eu/rinf-describe</a>.</p></div>
    </noscript>
    <header class="topbar">
      <a class="brand" href="/" data-nav><span class="logo" aria-hidden="true"></span><span><b>RINF</b> Describe</span></a>
      <form class="search" id="search-form" role="search">
        <input id="q" type="search" placeholder="Search a name or paste an IRI…" autocomplete="off" aria-label="Search a resource" aria-controls="q-results" aria-expanded="false" aria-autocomplete="list" />
        <ul id="q-results" class="suggest" role="listbox" hidden></ul>
      </form>
      <label class="env">
        <span class="sr-only">Environment</span>
        <select id="env-select" aria-label="Environment"></select>
      </label>
      <button id="theme-btn" class="icon-btn" type="button"></button>
    </header>
    <main id="app" tabindex="-1"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
