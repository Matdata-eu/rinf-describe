# Security headers of every answer. nginx drops the server's add_header in a location that
# has its own, so nginx.conf includes this file in those locations too.
#
# Content-Security-Policy: scripts, styles and fonts come from this site only. MapLibre fetches
# the map tiles from OpenStreetMap and OpenRailwayMap and runs its worker from this site;
# inline styles are set by the widgets and MapLibre. Change it if you add other tile servers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tiles.openrailwaymap.org; connect-src 'self' https://tile.openstreetmap.org https://*.tiles.openrailwaymap.org; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
