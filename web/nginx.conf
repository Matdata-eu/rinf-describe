server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MapLibre's worker is an ES module (.mjs); browsers refuse it as octet-stream.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/turtle application/n-triples text/csv;

    # Docker's DNS, re-resolved every 10 s so a recreated api container (new IP) is found.
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        set $api_upstream http://describe-api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
