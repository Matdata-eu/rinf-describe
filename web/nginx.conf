# Rate limit zones and trusted reverse proxies, written at start from DESCRIBE_RATE_LIMIT and
# DESCRIBE_TRUSTED_PROXIES (docker-entrypoint.d/40-describe-seo.sh, docs/deploy.md).
include /etc/nginx/describe/http.conf;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MapLibre's worker is an ES module (.mjs); browsers refuse it as octet-stream.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml
               image/svg+xml text/turtle application/n-triples text/csv;

    # Docker's DNS, re-resolved every 10 s so a recreated api container (new IP) is found.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Asks search engines not to index this instance unless DESCRIBE_PUBLIC_URL is set
    # (written at start by docker-entrypoint.d/40-describe-seo.sh, docs/seo.md). nginx
    # drops inherited add_header in a location with its own, so those include it too.
    include /etc/nginx/describe/robots.conf;
    # /sitemap.xml and /sitemap-N.xml, proxied to the API when indexing is allowed.
    include /etc/nginx/describe/sitemaps.conf;

    location /api/ {
        # Every uncached page is several queries to ERA's shared endpoint.
        include /etc/nginx/describe/api-limit.conf;
        set $api_upstream http://describe-api:8000;
        proxy_pass $api_upstream;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/describe/robots.conf;
        try_files $uri =404;
    }

    # Deployer-supplied pages (privacy statement), mounted from ./site; never fall back
    # to the app, so the frontend can tell whether a page exists.
    location /site/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/describe/robots.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/describe/robots.conf;
    }

    # Generated at start; never answered by the app's index.html.
    location = /robots.txt { try_files $uri =404; }
    location ~ ^/sitemap[^/]*\.xml$ { try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
